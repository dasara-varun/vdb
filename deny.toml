[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
# RustSec advisories are also enforced by the dedicated audit-check job.
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Keep external wildcard versions denied while allowing this private workspace's
# intentional path dependency from the CLI to vdb-core.
allow-wildcard-paths = true

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

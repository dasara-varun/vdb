name: release-artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: vdb-linux-x86_64.tar.gz
            binary: vdb
          - os: macos-13
            target: x86_64-apple-darwin
            archive: vdb-macos-x86_64.tar.gz
            binary: vdb
          - os: macos-14
            target: aarch64-apple-darwin
            archive: vdb-macos-aarch64.tar.gz
            binary: vdb
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: vdb-windows-x86_64.zip
            binary: vdb.exe

    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --workspace --release --target "${{ matrix.target }}"

      - name: Package Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          stage="package/vdb-${{ matrix.target }}"
          mkdir -p "$stage/docs"
          install -m 0755 "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$stage/${{ matrix.binary }}"
          cp LICENSE README.md CHANGELOG.md "$stage/"
          cp -R docs "$stage/"
          tar -C package -czf "package/${{ matrix.archive }}" "vdb-${{ matrix.target }}"
          shasum -a 256 "package/${{ matrix.archive }}" > "package/${{ matrix.archive }}.sha256"

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "package/vdb-${{ matrix.target }}"
          New-Item -ItemType Directory -Force "$stage/docs" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$stage/${{ matrix.binary }}"
          Copy-Item LICENSE, README.md, CHANGELOG.md "$stage/"
          Copy-Item -Recurse docs "$stage/"
          Compress-Archive -Path "$stage" -DestinationPath "package/${{ matrix.archive }}"
          $hash = (Get-FileHash "package/${{ matrix.archive }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.archive }}" | Out-File -Encoding ascii "package/${{ matrix.archive }}.sha256"

      - name: Upload checksummed artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: package/${{ matrix.archive }}*
          if-no-files-found: error
          retention-days: 14

name: VDB CI

on:
  push:
    branches: [main, "rewrite/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Documentation consistency
        run: ./scripts/check-docs.sh
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Release build
        run: cargo build --workspace --release --locked
      - name: GUI smoke
        run: ./scripts/gui-smoke.sh target/release/vdb

  lockfile-freshness:
    name: supply-chain / lockfile freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate hosted lockfile
        run: cargo generate-lockfile
      - name: Compare hosted lockfile
        run: git diff --exit-code -- Cargo.lock
      - name: Upload generated lockfile for diagnosis
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hosted-cargo-lock
          path: Cargo.lock

  security-audit:
    name: security / RustSec
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  platform-tests:
    name: tests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Workspace tests
        run: cargo test --workspace --locked

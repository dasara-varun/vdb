[workspace]
members = ["crates/vdb-core", "crates/vdb-cli"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
authors = ["VDB contributors"]

[workspace.dependencies]
anyhow = "1.0.75"
ciborium = "0.2.2"
chrono = { version = "0.4.31", features = ["serde", "clock"] }
clap = { version = "4.4.18", features = ["derive"] }
parking_lot = "0.12.1"
serde = { version = "1.0.195", features = ["derive"] }
serde_json = "1.0.111"
sha2 = "0.10.8"
thiserror = "2.0.20"
rustix = { version = "0.38.30", default-features = false, features = ["std", "fs"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
